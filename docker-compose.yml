# Optional: SQL Server for macOS/Linux (or Windows without LocalDB).
# Usage:  cp .env.example .env   (edit the password)   then   docker compose up -d
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    ports:
      - "1433:1433"
    volumes:
      - mystreet-sql:/var/opt/mssql
volumes:
  mystreet-sql:
